# Client Knowledge Cartridge — manifest
# Stamp a new client: copy this template, fill the fields, rename the repo to <client>.knowledge.

cartridge:
  client_id: <kebab-client-id>      # e.g. turbotax
  name: <Client Display Name>
  format: okf/0.1                   # .knowledge / OKF-aligned bundle format
  version: 0.1.0
  status: prototype                 # prototype | active | archived

contents:
  knowledge: true                   # history, wiki, decisions, people, sources
  brand: true                       # operable brand layer (design.md, voice, tokens, motion)
  skills: true                      # client-specific skills / specialists

boundary:
  # See BOUNDARY.md for the full rule.
  rises: "de-identified, generalized patterns and craft only"
  stays: "raw assets, data, and anything identifying"
  legal_signoff: false              # MUST be true before any real client data is added
