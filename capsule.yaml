# Knowledge Capsule — manifest
# Stamp a new subject: copy this template, fill the <placeholders>, rename the repo to <subject>.knowledge.
# Schema: dotKnowledge SPEC.md §5 (github.com/polychrome-studio/dotKnowledge).

subject: <kebab-subject-id>           # e.g. tucker, a-client-name
name: <Subject Display Name>          # human-readable; additive field, not in the base spec
type: <person | brand>                # person for yourself, brand for a client/company — see SPEC §2
relationship: <self | client | employer | partner>   # orthogonal to type (§2)
parent: <optional>                    # only set if this subject nests under another (e.g. a project under a client)
status: <active | shipped | archived> # subject lifecycle (§2.3) — set to a real value only when actually stamping
format_version: 0
rises: none                           # never | filtered | de-identified | none (§6) — see SCOPE.md.
                                       # `none` is the right default for a solo studio with no shared cross-subject layer yet.
access: open                          # open | protected (§5) — protected if this subject's material needs restricted access
local: true                           # true | false (§5) — cloneable/offline-capable vs. mediated-runtime-only
legal_signoff: false                  # set true before real data goes in, if a formal agreement matters for this subject

# Optional extension, additive to the base dotKnowledge manifest (§8: the format is designed to
# be extended, not just conformed to) — which optional layers this capsule actually carries.
contents:
  knowledge: true                     # wiki, decisions, sources, ledger
  brand: true                         # operable brand layer (design.md, voice.md, personas.md, tokens.json, motion.md) — omit for a person capsule
  skills: true                        # subject-specific skills — subject-specific capability only (SPEC §3); generic operating mechanism stays in the harness, never here
